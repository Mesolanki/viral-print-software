appId: com.viralprint.software
productName: Viral Print Software
directories:
  buildResources: build
  output: dist
asar: false
files:
  - 'out/**/*'
  - 'package.json'


extraResources:
  - from: '../server'
    to: 'server'
    filter:
      - '**/*'
      - '!node_modules/.cache/**'
asarUnpack:
  - resources/**
win:
  executableName: ViralPrintSoftware
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: ViralPrintSoftware-Setup-${version}.${ext}
  shortcutName: Viral Print Software
  uninstallDisplayName: Viral Print Software
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
